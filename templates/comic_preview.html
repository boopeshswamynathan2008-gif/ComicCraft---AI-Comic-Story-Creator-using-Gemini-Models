<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comic Preview</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f6f4fb; margin: 0; padding: 24px; }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
      .panel { background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; }
      .panel img { width: 100%; height: 260px; object-fit: cover; display: block; background: #e9e0ff; }
      .panel-body { padding: 14px; }
      .panel-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 8px; }
      .narration { color: #444; margin: 8px 0; }
      .dialogue { color: #2e4b9f; font-weight: bold; }
      .download { display: block; width: 100%; box-sizing: border-box; text-align: center; margin-top: 26px; text-decoration: none; background: #3f7ee8; color: white; padding: 14px 22px; border: 0; border-radius: 12px; font: inherit; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>{{ story_title }}</h1>
      <div class="grid">
        {% for panel in panels %}
        <div class="panel">
          <img src="{{ panel.image }}" alt="{{ panel.title }}" />
          <div class="panel-body">
            <div class="panel-title">{{ panel.title }}</div>
            <p class="narration">Narration: {{ panel.narration }}</p>
            <p class="dialogue">{{ panel.dialogue }}</p>
          </div>
        </div>
        {% endfor %}
      </div>
      <form action="/export-pdf" method="post">
        {% for panel in panels %}
        <input type="hidden" name="panel_{{ panel.panel }}" value="{{ panel.title }}" />
        <input type="hidden" name="panel_{{ panel.panel }}_narration" value="{{ panel.narration }}" />
        <input type="hidden" name="panel_{{ panel.panel }}_dialogue" value="{{ panel.dialogue }}" />
        <input type="hidden" name="panel_{{ panel.panel }}_image" value="{{ panel.image }}" />
        {% endfor %}
        <button class="download" type="submit">Download PDF</button>
      </form>
    </div>
  </body>
</html>
